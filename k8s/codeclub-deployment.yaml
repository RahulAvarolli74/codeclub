apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeclub-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeclub-app
  template:
    metadata:
      labels:
        app: codeclub-app
    spec:
      containers:
        - name: codeclub-app
          image: codeclub-app:latest # Make sure to build this image in minikube
          imagePullPolicy: Never # Use local image
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: codeclub-secrets
          # Optional: Init container for migrations if needed, but for now assuming the CMD handles it or manual job
